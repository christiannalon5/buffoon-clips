<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Login Callback</title>
<style>
  :root{
    --bg:#faf9f7; --fg:#15151f; --fg-muted:#5c5c6b;
    --accent:#e11d48; --border:#e4e2df; --surface:#ffffff;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f0f1a; --fg:#f3f2f0; --fg-muted:#9a98a8;
      --accent:#fe2c55; --border:#26263a; --surface:#181826;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:520px; width:100%; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:28px 26px;
  }
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--fg-muted);font-size:14px;line-height:1.6;margin:0 0 20px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);margin-bottom:6px}
  .field{margin-bottom:18px}
  textarea{
    width:100%; font-family:ui-monospace,monospace; font-size:13px;
    padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--fg); resize:vertical;
  }
  button{
    background:var(--accent); color:white; border:none; border-radius:8px;
    padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .copied{color:var(--accent);font-size:13px;margin-left:10px}
  .err{color:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <h1>TikTok login callback</h1>
    <p>Copia estos valores y pégalos en n8n para intercambiarlos por el access token.</p>
    <div class="field">
      <label>code</label>
      <textarea id="code" rows="3" readonly></textarea>
    </div>
    <div class="field">
      <label>state</label>
      <textarea id="state" rows="1" readonly></textarea>
    </div>
    <button onclick="copyCode()">Copiar code</button>
    <span class="copied" id="copiedMsg" style="display:none">Copiado ✓</span>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '(no se ha recibido ningún "code" — revisa el error de TikTok)';
    const state = params.get('state') || '';
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    document.getElementById('code').value = error ? `ERROR: ${error} - ${errorDesc || ''}` : code;
    document.getElementById('state').value = state;
    function copyCode(){
      const el = document.getElementById('code');
      el.select();
      try {
        navigator.clipboard.writeText(el.value);
      } catch(e) {
        document.execCommand('copy');
      }
      const msg = document.getElementById('copiedMsg');
      msg.style.display = 'inline';
      setTimeout(() => msg.style.display = 'none', 2000);
    }
  </script>
</body>
</html>
